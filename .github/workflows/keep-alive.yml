name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 0 */5 * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/?apikey=${SUPABASE_ANON_KEY}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Ping returned HTTP $STATUS"
          if [ "$STATUS" == "000" ]; then
            echo "Supabase is unreachable"
            exit 1
          fi
          echo "Supabase is alive (HTTP $STATUS)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'CRITICAL: Supabase keep-alive ping failed',
              body: 'The scheduled ping to Supabase failed. [View logs](' + runUrl + ')',
              labels: ['urgent', 'infra'],
            });
